<!doctype html><html><head><meta charset="utf-8"><title>Stonehenge projection</title>
<style>
@font-face{font-family:ID;src:url(/fonts/InterDisplay-SemiBold.otf);font-weight:600}
@font-face{font-family:IDB;src:url(/fonts/InterDisplay-Bold.otf)}
@font-face{font-family:IM;src:url(/fonts/Inter-Medium.otf)}
@font-face{font-family:JM;src:url(/fonts/JetBrainsMono-Medium.ttf)}
html,body{margin:0;background:#06080b;width:1080px;height:1920px;overflow:hidden}
#c{position:absolute;left:0;top:0}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 55% at 50% 38%,rgba(0,0,0,0) 40%,rgba(0,0,0,.72) 100%)}
#shade{position:absolute;left:0;right:0;bottom:0;height:700px;background:linear-gradient(rgba(6,8,11,0),rgba(6,8,11,.88) 45%)}
#topshade{position:absolute;left:0;right:0;top:0;height:420px;background:linear-gradient(rgba(6,8,11,.9),rgba(6,8,11,0))}
.t{position:absolute;color:#f1f2ee;white-space:nowrap}
#id{left:60px;top:74px;font:500 24px JM;letter-spacing:.14em;color:#8fa0a8}
#hook{left:60px;top:118px;font:600 74px/82px ID;letter-spacing:-.01em}
#num{left:52px;top:1118px;font:700 168px/168px IDB;letter-spacing:-.03em}
#num small{font:500 66px IM;letter-spacing:0;color:#9aa3a8;margin:0 6px 0 4px}
#lab{left:60px;top:1296px;font:500 42px IM;color:#e6e8e4}
.lg{left:60px;font:500 24px JM;color:#c9d0d2;letter-spacing:.02em}
.sw{display:inline-block;width:26px;height:26px;margin-right:16px;vertical-align:-5px;border-radius:3px}
#scale{left:60px;top:1074px;font:500 22px JM;color:#a9b4b9;letter-spacing:.06em}
#src{left:60px;top:1488px;font:500 22px JM;color:#8e999e}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas><div id="topshade"></div><div id="vig"></div><div id="shade"></div>
<div class="t" id="id">STONEHENGE · WILTSHIRE</div>
<div class="t" id="hook">How much of Stonehenge<br>is still standing?</div>
<div class="t" id="num"><span id="n">16</span><small>of</small><span id="of">30</span></div>
<div class="t" id="lab">circle uprights still stand</div>
<div class="t lg" style="top:1362px"><span class="sw" style="background:#f3f3f1"></span>WHITE MATTER  stands today · LiDAR 2021</div>
<div class="t lg" style="top:1402px"><span class="sw" style="background:#27d6ee;box-shadow:0 0 14px #27d6eeaa"></span>PROJECTED LIGHT  inferred · c. 2500 BC</div>
<div class="t" id="scale">MODEL 1:200 · PLATE 80 m · GROUND FLATTENED</div>
<div class="t" id="src">OpenStreetMap contributors · Environment Agency LIDAR, OGL</div>
<script src="/node_modules/three/build/three.min.js"></script>
<script>
(async()=>{
const S=await (await fetch('/scene.json')).json();
document.getElementById('n').textContent=S.nstand;
const W=1080,H=1920,PR=S.plate;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setClearColor(0x06080b);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const CY=0x27d6ee;
// camera from the north-east (the horseshoe opens that way), 39 deg up
const az=THREE.MathUtils.degToRad(+window.AZ||128), el=THREE.MathUtils.degToRad(+window.EL||37), D=+window.D||205;
const cam=new THREE.PerspectiveCamera(+window.FOV||22,W/H,10,800);
const tgt=new THREE.Vector3(0,+window.TY||1,0);
cam.position.set(D*Math.cos(el)*Math.sin(az),D*Math.sin(el),D*Math.cos(el)*Math.cos(az)).add(tgt);cam.lookAt(tgt);
cam.setViewOffset(W,H,0,+window.VO||-120,W,H);
// lights
scene.add(new THREE.HemisphereLight(0xdfe6ee,0x30343a,0.4));
const key=new THREE.DirectionalLight(0xfff6ea,2.5);
const ka=az+THREE.MathUtils.degToRad(+window.KA||-62);
key.position.set(110*Math.sin(ka),95,110*Math.cos(ka));
key.castShadow=true;key.shadow.mapSize.set(4096,4096);const sc=key.shadow.camera;sc.left=-62;sc.right=62;sc.top=62;sc.bottom=-62;sc.near=10;sc.far=330;
key.shadow.radius=5;key.shadow.bias=-0.0006;key.shadow.normalBias=0.08;
scene.add(key);
const proj=new THREE.Vector3(-30,150,60);
const matter=new THREE.MeshStandardMaterial({color:0xf3f3f1,roughness:0.9,metalness:0});
// ---- plinth + plate
const plinth=new THREE.Mesh(new THREE.CylinderGeometry(PR+6,PR+7.5,9,96),new THREE.MeshStandardMaterial({color:0x14181d,roughness:0.35,metalness:0.25}));
plinth.position.y=-1.8-4.5;plinth.receiveShadow=true;scene.add(plinth);
const floor=new THREE.Mesh(new THREE.CircleGeometry(400,64),new THREE.MeshStandardMaterial({color:0x07090c,roughness:0.6}));
floor.rotation.x=-Math.PI/2;floor.position.y=-10.4;scene.add(floor);
// canvases: base (ditches) and light (projection, emissive)
const TS=2048,k=TS/(2*PR);const P=(x,z)=>[(x+PR)*k,(z+PR)*k];
function mk(){const c=document.createElement('canvas');c.width=c.height=TS;return c}
const bc=mk(),bx=bc.getContext('2d');bx.fillStyle='#6f7378';bx.fillRect(0,0,TS,TS);
bx.save();bx.beginPath();bx.arc(TS/2,TS/2,PR*k,0,7);bx.clip();
bx.lineCap='round';bx.lineJoin='round';
S.ditch.forEach(d=>{bx.beginPath();d.forEach((p,i)=>{const q=P(p[0],p[1]);i?bx.lineTo(q[0],q[1]):bx.moveTo(q[0],q[1])});bx.strokeStyle='#3f4347';bx.lineWidth=2.6*k;bx.globalAlpha=.5;bx.stroke();bx.strokeStyle='#2c2f33';bx.lineWidth=1.3*k;bx.globalAlpha=.75;bx.stroke()});
bx.restore();
const lc=mk(),lx=lc.getContext('2d');lx.fillStyle='#000';lx.fillRect(0,0,TS,TS);
// the throw: a soft pool of light on the plate
let g=lx.createRadialGradient(TS/2,TS/2,0,TS/2,TS/2,26*k);g.addColorStop(0,'rgba(24,150,175,.55)');g.addColorStop(.6,'rgba(20,120,140,.3)');g.addColorStop(1,'rgba(0,0,0,0)');lx.fillStyle=g;lx.fillRect(0,0,TS,TS);
// inferred geometry (metres, x east, z south) -------------------------------------------
const R=S.R,rad=a=>a*Math.PI/180;
const items=[]; // {x,z,rot,w,d,y0,y1,kind}
const cen=S.stones.map(s=>{let x=0,z=0;s.poly.forEach(p=>{x+=p[0];z+=p[1]});return [x/s.poly.length,z/s.poly.length,s]});
// sarsen circle: missing uprights (fallen or gone) and the 30 lintels
S.slots.forEach(sl=>{const a=rad(sl.ang),x=R*Math.cos(a),z=-R*Math.sin(a);
 if(sl.state!=='standing')items.push({x,z,a,w:2.1,d:1.1,y0:0,y1:4.1,kind:'up'});
 const b=rad(sl.ang+6),m=R*Math.cos(rad(6));items.push({x:m*Math.cos(b),z:-m*Math.sin(b),a:b,w:3.5,d:1.05,y0:4.1,y1:4.9,kind:'lin'});});
// trilithons: 10 uprights, 5 lintels; matter where a tall mapped stone stands
const rin=S.rin;
S.tri_ang.forEach((ang,j)=>{const a=rad(ang),x=rin*Math.cos(a),z=-rin*Math.sin(a);
 const has=cen.some(c=>c[2].h>=4.5&&c[2].r<12&&Math.hypot(c[0]-x,c[1]-z)<2.0);
 if(!has)items.push({x,z,a,w:2.1,d:1.2,y0:0,y1:6.2,kind:'up'});
 if(j%2===0){const b=rad(ang-11),m=rin*Math.cos(rad(11));items.push({x:m*Math.cos(b),z:-m*Math.sin(b),a:b,w:4.4,d:1.2,y0:6.2,y1:7.1,kind:'lin'})}});
// bluestone ring: radius from the small mapped stones, 60 positions (count is a guess)
for(let i=0;i<60;i++){const a=rad(i*6+3),x=S.rblue*Math.cos(a),z=-S.rblue*Math.sin(a);
 if(cen.some(c=>c[2].r<15&&c[2].r>9&&c[2].area<4&&Math.hypot(c[0]-x,c[1]-z)<1.0))continue;
 items.push({x,z,a,w:0.9,d:0.6,y0:0,y1:2.0,kind:'blue'})}
// footprints on the plate as projected light
items.forEach(it=>{if(it.y0>0)return;const q=P(it.x,it.z);lx.save();lx.translate(q[0],q[1]);lx.rotate(-it.a+Math.PI/2*0);
 lx.rotate(0);lx.shadowColor='rgba(39,214,238,1)';lx.shadowBlur=2.2*k;lx.fillStyle='rgba(39,214,238,.95)';
 lx.rotate(it.a);lx.rotate(-it.a);const c=Math.cos(it.a),s=Math.sin(it.a);lx.setTransform(1,0,0,1,0,0);
 // oriented rect: tangent direction of angle a in plan = (-sin a, -cos a)... build points
 const tx=-Math.sin(it.a),tz=-Math.cos(it.a),rx=Math.cos(it.a),rz=-Math.sin(it.a);
 const pts=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([u,v])=>P(it.x+tx*u*it.w/2+rx*v*it.d/2,it.z+tz*u*it.w/2+rz*v*it.d/2));
 lx.beginPath();pts.forEach((p,i)=>i?lx.lineTo(p[0],p[1]):lx.moveTo(p[0],p[1]));lx.closePath();lx.fill();lx.fill();lx.restore()});
const bt=new THREE.CanvasTexture(bc),lt=new THREE.CanvasTexture(lc);bt.colorSpace=THREE.SRGBColorSpace;lt.colorSpace=THREE.SRGBColorSpace;bt.anisotropy=8;lt.anisotropy=8;
const top=new THREE.MeshStandardMaterial({map:bt,roughness:0.92,emissive:0xffffff,emissiveMap:lt,emissiveIntensity:1});
const side=new THREE.MeshStandardMaterial({color:0x9a9da1,roughness:0.9});
const plate=new THREE.Mesh(new THREE.CylinderGeometry(PR,PR,1.8,128),[side,top,side]);
plate.position.y=-0.9;plate.receiveShadow=true;scene.add(plate);
// ---- matter
function shapeOf(poly){const sh=new THREE.Shape();poly.forEach((p,i)=>i?sh.lineTo(p[0],-p[1]):sh.moveTo(p[0],-p[1]));return sh}
function extrude(poly,h,mat){const gm=new THREE.ExtrudeGeometry(shapeOf(poly),{depth:h,bevelEnabled:false});gm.rotateX(-Math.PI/2);
 const m=new THREE.Mesh(gm,mat||matter);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
let standing=0,lying=0;
S.stones.forEach(s=>{let h=s.h;if(h>=2.5){h=Math.min(h,s.r>13.4?4.1:6.8);standing++}else{h=Math.max(0.35,Math.min(h,1.1));lying++}
 extrude(s.poly,h)});
// banks / barrows
S.bank.forEach(b=>{
 if(b.closed){extrude(b.pts,0.9);return}
 for(let i=0;i<b.pts.length-1;i++){let p=b.pts[i],q=b.pts[i+1];const pr=Math.hypot(...p),qr=Math.hypot(...q);if(pr>PR-1.5&&qr>PR-1.5)continue;
  const dx=q[0]-p[0],dz=q[1]-p[1],L=Math.hypot(dx,dz);if(L<.1)continue;
  const m=new THREE.Mesh(new THREE.BoxGeometry(L+0.6,0.7,2.4),matter);m.position.set((p[0]+q[0])/2,0.35,(p[1]+q[1])/2);m.rotation.y=-Math.atan2(dz,dx);m.castShadow=m.receiveShadow=true;scene.add(m)}});
// ---- projected light volumes
const lightMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 uniforms:{col:{value:new THREE.Color(CY)},pp:{value:proj},h1:{value:7.2}},
 vertexShader:`varying vec3 wN;varying vec3 wP;void main(){wN=normalize(mat3(modelMatrix)*normal);vec4 w=modelMatrix*vec4(position,1.);wP=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
 fragmentShader:`uniform vec3 col;uniform vec3 pp;uniform float h1;varying vec3 wN;varying vec3 wP;
 void main(){vec3 L=normalize(pp-wP);float nl=max(dot(normalize(wN),L),0.);float lit=0.42+0.58*nl;
 float fade=mix(1.0,0.62,clamp(wP.y/h1,0.,1.));vec3 V=normalize(cameraPosition-wP);float rim=pow(1.-abs(dot(normalize(wN),V)),2.0);
 float a=(0.42+0.34*rim)*lit*fade;gl_FragColor=vec4(col*a*1.15+vec3(0.06,0.14,0.16)*rim*fade,a);}`});
items.forEach(it=>{const h=it.y1-it.y0;const m=new THREE.Mesh(new THREE.BoxGeometry(it.w,h,it.d),lightMat);
 m.position.set(it.x,it.y0+h/2,it.z);m.rotation.y=it.a;m.renderOrder=5;scene.add(m)});
// spill of light past the throw: faint halo ring on the plinth
renderer.render(scene,cam);
window.DONE=true;window.STATS={standing,lying,items:items.length,nstand:S.nstand,nfall:S.nfall};
})();
</script></body></html>
